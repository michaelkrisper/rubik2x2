version: 2

# Weekly checks for every ecosystem in the repo; minor and patch bumps arrive as
# one grouped PR per ecosystem, majors separately. dependabot-automerge.yml
# merges each Dependabot PR once CI is green.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Majors included: separate PRs on the same workflow file block each other's auto-merge.
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: nuget
    directory: /csharp
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /rust
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: gomod
    directory: /go
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /javascript
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: /python
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
