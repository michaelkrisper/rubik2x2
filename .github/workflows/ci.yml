name: ci

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

# Every job asserts the same thing in a different language: that building the
# distance table reproduces OEIS A079762. If a move table or an encoding is
# wrong anywhere, that check is what catches it.
jobs:
  asm:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: asm } }
    steps:
      - uses: actions/checkout@v7
      - run: make
      - run: make test
      - run: ./rubik2x2 table
      - run: ./rubik2x2 bench --json --scrambles ../bench/scrambles.txt

  c:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu's default gcc predates -std=c23; gcc-14 is the first that takes it.
        include:
          - { compiler: gcc-14, install: gcc-14 }
          - { compiler: clang, install: clang }
    env:
      # A shared runner is not the target machine, and its CPU advertises
      # feature combinations that -march=native turns into -Werror failures.
      ARCH: -march=x86-64-v2
    name: c (${{ matrix.compiler }})
    defaults: { run: { working-directory: c } }
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y ${{ matrix.install }}
      - run: make CC=${{ matrix.compiler }}
      - run: make CC=${{ matrix.compiler }} test
      - run: ./rubik2x2 table
      - run: ./rubik2x2 bench --json --scrambles ../bench/scrambles.txt

  cpp:
    runs-on: ubuntu-latest
    # Only g++ here. The clang C++ build is measured locally (see the benchmark
    # tables) but cannot be built on this runner: the code needs std::expected,
    # std::jthread and std::atomic_ref, and neither standard library available to
    # the runner's clang has all three. libstdc++ hides <expected> unless
    # __cpp_concepts reports 202002L, which that clang does not; libc++ has
    # <expected> but no std::jthread. Newer clang has both -- Fedora 44 builds it
    # clean -- so this is the runner's toolchain, not the code.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { compiler: g++-14, install: g++-14, stdlib: '' }
    env:
      ARCH: -march=x86-64-v2
    name: cpp (${{ matrix.compiler }})
    defaults: { run: { working-directory: cpp } }
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y ${{ matrix.install }}
      - run: make CXX=${{ matrix.compiler }} STDLIB=${{ matrix.stdlib }}
      - run: make CXX=${{ matrix.compiler }} STDLIB=${{ matrix.stdlib }} test
      - run: ./rubik2x2 table
      - run: ./rubik2x2 bench --json --scrambles ../bench/scrambles.txt

  rust:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: rust } }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --release --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release
      - run: ./target/release/rubik2x2 table
      - run: ./target/release/rubik2x2 bench --json --scrambles ../bench/scrambles.txt

  go:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: go } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go/go.mod }
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - run: go build -o rubik2x2 ./cmd/rubik2x2
      - run: ./rubik2x2 table
      - run: ./rubik2x2 bench --json --scrambles ../bench/scrambles.txt

  csharp:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: csharp } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with: { dotnet-version: "10.0.x" }
      - run: dotnet build -c Release
      - run: dotnet test -c Release
      - run: dotnet publish -c Release -o publish
      - run: ./publish/rubik2x2 table
      - run: ./publish/rubik2x2 bench --json --scrambles ../bench/scrambles.txt

  javascript:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: javascript } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "26" }
      - run: node --test
      - run: node src/cli.js table
      - run: node src/cli.js bench --json --scrambles ../bench/scrambles.txt

  python:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: python } }
    strategy:
      fail-fast: false
      matrix:
        # The pure-Python table build must keep working without numpy.
        extras: ["", "numpy"]
    name: python (${{ matrix.extras == '' && 'no numpy' || 'with numpy' }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.15" }
      - run: python -m pip install --upgrade pip && pip install pytest ruff ${{ matrix.extras }}
      - run: ruff check .
      - run: pytest
      - run: pytest -m slow
      - run: python -m pyrubik table

  tools:
    # The benchmark harness that renders the README tables.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.15" }
      - run: python -m pip install --upgrade pip && pip install pytest ruff
      - run: ruff check tools
      - run: ruff format --check tools/tests
      - run: pytest -q tools/tests

  agree:
    # The point of eight implementations: they must give the same answers.
    needs: [asm, c, cpp, rust, go, csharp, javascript, python, tools]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All implementations built, tested and reproduced OEIS A079762."
