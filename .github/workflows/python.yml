name: python

on:
  push:
    branches: [master, main]
    paths: ["python/**", ".github/workflows/python.yml"]
  pull_request:
    paths: ["python/**", ".github/workflows/python.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: python

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The pure-Python path must keep working without numpy installed.
        extras: ["", "numpy"]
    name: test (${{ matrix.extras == '' && 'no numpy' || 'with numpy' }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest ruff ${{ matrix.extras }}

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

      - name: Test the distance table
        run: pytest -m slow

      - name: Benchmark
        run: python -m pyrubik bench -n 25
